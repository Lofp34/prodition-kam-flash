<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards</title>
<style>
:root{--bg:#f5f7f8;--text:#102a33;--muted:#60717a;--brand:#145766;--brand2:#1d7f91;--soft:#e6f3f5;--line:rgba(16,42,51,.12);--shadow:0 18px 60px rgba(16,42,51,.12);--r:26px}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,rgba(29,127,145,.18),transparent 30%),radial-gradient(circle at 90% 10%,rgba(20,87,102,.14),transparent 35%),var(--bg)}
.container{width:min(1120px,calc(100% - 24px));margin:auto;padding:12px 0 42px}.hidden{display:none!important}
.home-grid,.all-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tile,.mini{border:1px solid var(--line);background:rgba(255,255,255,.76);border-radius:var(--r);padding:22px;box-shadow:0 10px 35px rgba(16,42,51,.07);cursor:pointer}
.tile:hover,.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.badge,.pill,.stat{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:850}
.tile h2{font-size:25px;letter-spacing:-.035em;margin:12px 0 8px}.tile p{color:var(--muted);line-height:1.45;margin:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.pill,.stat{background:rgba(255,255,255,.72);color:var(--muted)}
.study-head{text-align:center;padding:20px 12px 10px}.study-head h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;line-height:1.03;margin:12px 0 5px}.study-head p{color:var(--muted);margin:0}
.toolbar{position:sticky;top:0;z-index:5;padding:9px 0;background:rgba(245,247,248,.88);backdrop-filter:blur(18px);display:grid;gap:8px}
.controls,.stats,.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button,input,select{font:inherit;min-height:41px;border-radius:13px}button{border:0;padding:9px 13px;background:var(--text);color:white;font-weight:850;cursor:pointer}button.secondary{background:white;color:var(--text);border:1px solid var(--line)}button.good{background:var(--brand)}input,select{border:1px solid var(--line);background:white;padding:9px 12px;color:var(--text)}input{min-width:min(350px,100%)}.filter-toggle{display:none}
.stage{display:grid;place-items:center;gap:13px;margin-top:13px}.progress{width:min(780px,100%);height:8px;background:rgba(16,42,51,.08);border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0}
.card-wrap{width:min(780px,100%);min-height:390px;perspective:1400px}.card{position:relative;min-height:390px;transform-style:preserve-3d;cursor:pointer;box-shadow:var(--shadow);border-radius:var(--r)}
.face{position:absolute;inset:0;border-radius:var(--r);padding:clamp(24px,4vw,42px);display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s,transform .5s,visibility .25s;backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,255,255,.82));opacity:1;visibility:visible;transform:rotateY(0) translateZ(1px)}
.back{background:linear-gradient(145deg,#123642,#165667);color:white;opacity:0;visibility:hidden;transform:rotateY(-180deg) translateZ(1px)}
.card.flipped .front{opacity:0;visibility:hidden;transform:rotateY(180deg) translateZ(1px)}.card.flipped .back{opacity:1;visibility:visible;transform:rotateY(0) translateZ(1px)}
.category{width:max-content;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:13px;font-weight:850}.back .category{background:rgba(255,255,255,.14);color:white}
.question{font-size:clamp(28px,4.5vw,44px);font-weight:850;line-height:1.12;letter-spacing:-.035em}.answer{font-size:clamp(21px,3.1vw,34px);font-weight:760;line-height:1.23;letter-spacing:-.025em}.hint{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:10px}.back .hint{color:rgba(255,255,255,.7)}
.card.media-card,.card-wrap.media-card{min-height:660px}.face.media-face{justify-content:flex-start;gap:14px;overflow-y:auto}.media{display:none;margin:0;width:100%;border-radius:18px;overflow:hidden;border:1px solid rgba(16,42,51,.12);background:rgba(255,255,255,.72);flex:0 0 auto}.media.visible{display:block}.media img{display:block;width:100%;height:300px;object-fit:cover;background:#e9eff1}.media.contain img{object-fit:contain;background:#f8fafb}.media-caption{padding:8px 10px 4px;font-size:12px;color:var(--muted);font-weight:700;line-height:1.35}.back .media-caption{color:rgba(255,255,255,.8)}.media-credit{padding:0 10px 9px;font-size:10px;line-height:1.35;color:var(--muted)}.back .media-credit{color:rgba(255,255,255,.62)}.media-credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}.media-error{display:grid;place-items:center;height:220px;padding:20px;text-align:center;color:var(--muted);font-size:13px;font-weight:700;background:repeating-linear-gradient(135deg,rgba(20,87,102,.04),rgba(20,87,102,.04) 12px,rgba(255,255,255,.5) 12px,rgba(255,255,255,.5) 24px)}
.phrases{margin-top:28px;padding:22px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--r)}.phrases li{margin:9px 0;font-weight:700}.all-cards{margin-top:28px}.mini .tag{font-size:11px;text-transform:uppercase;color:var(--brand);font-weight:850}.mini h3{font-size:16px;line-height:1.25;margin:8px 0 0}
.empty{display:none;color:var(--muted);padding:30px;text-align:center}
@media(max-width:700px){
.study-head{display:none}.container{width:calc(100% - 18px);padding-top:8px}.toolbar{position:static}.controls{display:grid;grid-template-columns:1fr 1fr 1fr}.filter-toggle{display:block}
#homeBtn{grid-column:1}#filterToggle{grid-column:2}#shuffle{grid-column:3}#mastered{grid-column:1/4}
#search,#category,#reset{grid-column:1/4}.controls:not(.filters-open) #search,.controls:not(.filters-open) #category,.controls:not(.filters-open) #reset{display:none}
.controls button,.controls input,.controls select{font-size:14px;min-height:38px;padding:8px}.stats .stat:last-child{display:none}.stat{font-size:11px;padding:6px 8px}
.card-wrap,.card{min-height:min(610px,calc(100svh - 230px))}.card.media-card,.card-wrap.media-card{min-height:max(680px,calc(100svh - 190px))}.face{padding:23px 21px}.question{font-size:clamp(26px,7vw,36px)}.answer{font-size:clamp(21px,6.1vw,32px)}.media img{height:270px}
.nav{position:sticky;bottom:0;padding:17px 0 6px;background:linear-gradient(180deg,rgba(245,247,248,0),rgba(245,247,248,.96) 30%)}.nav button{flex:1;padding:8px}.all-cards,.phrases{display:none}.home-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<section id="homeView"><main class="container"><div id="homeGrid" class="home-grid"></div></main></section>
<section id="studyView" class="hidden">
<header class="study-head"><span class="badge" id="studyBadge"></span><h1 id="studyTitle"></h1><p id="studySubtitle"></p></header>
<main class="container">
<section class="toolbar">
<div class="controls" id="controls">
<button class="secondary" id="homeBtn">← Accueil</button>
<button class="secondary filter-toggle" id="filterToggle">Filtres</button>
<button class="secondary" id="shuffle">Mélanger</button>
<button class="good" id="mastered">Je maîtrise</button>
<input id="search" type="search" placeholder="Rechercher une notion…">
<select id="category"><option value="all">Toutes les catégories</option></select>
<button class="secondary" id="reset">Réinitialiser</button>
</div>
<div class="stats"><span class="stat" id="counter"></span><span class="stat" id="masteredCount"></span><span class="stat">Espace : retourner • ←/→ : naviguer</span></div>
</section>
<section class="stage">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card-wrap"><div class="card" id="card">
<div class="face front" id="frontFace"><div class="category" id="catFront"></div><div class="media" id="mediaFront"></div><div class="question" id="front"></div><div class="hint"><span>Cliquer pour voir la réponse</span><span id="idxFront"></span></div></div>
<div class="face back" id="backFace"><div class="category" id="catBack"></div><div class="media" id="mediaBack"></div><div class="answer" id="back"></div><div class="hint"><span>Cliquer pour revenir</span><span id="idxBack"></span></div></div>
</div></div>
<div class="nav"><button class="secondary" id="prev">← Précédente</button><button class="secondary" id="flip">Retourner</button><button id="next">Suivante →</button></div>
<div class="empty" id="empty">Aucune carte ne correspond.</div>
</section>
<section class="phrases hidden" id="phrasesBox"><h2>À garder en tête</h2><ol id="phrasesList"></ol></section>
<section class="all-cards" id="allCards"></section>
</main>
</section>
<script src="decks.js?v=4"></script>
<script src="first317-folders.js?v=11"></script>
<script src="first317-prise.js?v=1"></script>
<script src="first317-reglages.js?v=1"></script>
<script src="first317-manoeuvres.js?v=1"></script>
<script src="first317-systemes.js?v=1"></script>
<script src="first317-visual.js?v=1"></script>
<script>
const FOLDERS=FC_DATA.folders;
const DECKS=FC_DATA.decks.map(d=>({...d,cards:d.cards.map(c=>Array.isArray(c)?{category:c[0],front:c[1],back:c[2]}:c)}));
let currentFolder=null,deck=null,filtered=[],index=0,flipped=false,mastered=new Set();
const $=id=>document.getElementById(id),card=$('card'),search=$('search'),category=$('category'),controls=$('controls');
function children(parent){return FOLDERS.filter(f=>(f.parent||null)===(parent||null))}
function decksIn(folder){return DECKS.filter(d=>d.folder===folder)}
function folder(id){return FOLDERS.find(f=>f.id===id)}
function storageKey(){return 'mastered:'+deck.id}
function loadMastered(){try{mastered=new Set(JSON.parse(localStorage.getItem(storageKey())||'[]'))}catch{mastered=new Set()}}
function saveMastered(){localStorage.setItem(storageKey(),JSON.stringify([...mastered]))}
function cardId(c){return c.category+'|'+c.front}
function renderHome(){
 let html='';
 if(currentFolder){
   const p=folder(currentFolder)?.parent||null;
   const label=p?folder(p)?.label:'Familles';
   html+=`<article class="tile" onclick="${p?`openFolder('${p}')`:'goHome()'}"><span class="badge">Retour</span><h2>← ${label}</h2><p>Revenir au niveau précédent.</p></article>`;
 }
 children(currentFolder).forEach(f=>{
   html+=`<article class="tile" onclick="openFolder('${f.id}')"><span class="badge">Dossier</span><h2>${f.label}</h2><p>${f.desc||''}</p><div class="meta"><span class="pill">${children(f.id).length} sous-dossiers</span><span class="pill">${decksIn(f.id).length} jeux</span></div></article>`;
 });
 decksIn(currentFolder).forEach(d=>{
   html+=`<article class="tile" onclick="openDeck('${d.id}')"><span class="badge">${d.badge||'Jeu'}</span><h2>${d.title}</h2><p>${d.description||''}</p><div class="meta"><span class="pill">${d.cards.length} cartes</span><span class="pill">${new Set(d.cards.map(c=>c.category)).size} catégories</span></div></article>`;
 });
 $('homeGrid').innerHTML=html||'<article class="tile"><span class="badge">Vide</span><h2>Aucun jeu ici</h2></article>';
}
window.goHome=function(){currentFolder=null;deck=null;location.hash='';$('studyView').classList.add('hidden');$('homeView').classList.remove('hidden');renderHome()}
window.openFolder=function(id){currentFolder=id;location.hash='folder='+id;$('studyView').classList.add('hidden');$('homeView').classList.remove('hidden');renderHome();scrollTo({top:0})}
window.openDeck=function(id){
 deck=DECKS.find(d=>d.id===id);if(!deck)return;
 location.hash='deck='+id;filtered=[...deck.cards];index=0;flipped=false;search.value='';loadMastered();
 category.innerHTML='<option value="all">Toutes les catégories</option>';
 [...new Set(deck.cards.map(c=>c.category))].sort((a,b)=>a.localeCompare(b,'fr')).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;category.appendChild(o)});
 $('studyBadge').textContent=deck.badge||'Flashcards';$('studyTitle').textContent=deck.title;$('studySubtitle').textContent=deck.subtitle||'';
 $('homeView').classList.add('hidden');$('studyView').classList.remove('hidden');renderPhrases();render();scrollTo({top:0});
}
function renderPhrases(){const box=$('phrasesBox');if(deck.phrases?.length){box.classList.remove('hidden');$('phrasesList').innerHTML=deck.phrases.map(p=>`<li>${p}</li>`).join('')}else box.classList.add('hidden')}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function renderMedia(targetId,c,isBack=false){
 const target=$(targetId);const src=(isBack&&c.imageBack)||c.image;
 target.className='media'+(c.imageFit==='contain'?' contain':'');
 target.innerHTML='';
 if(!src)return;
 target.classList.add('visible');
 const img=document.createElement('img');img.src=src;img.alt=c.caption||c.front;img.loading='eager';img.referrerPolicy='no-referrer';
 img.onerror=()=>{target.innerHTML=`<div class="media-error">Image indisponible — ouvre la source depuis le crédit.</div>${c.caption?`<div class="media-caption">${escapeHtml(c.caption)}</div>`:''}${c.source?`<div class="media-credit"><a href="${escapeHtml(c.source)}" target="_blank" rel="noopener noreferrer">Voir la source</a></div>`:''}`};
 target.appendChild(img);
 if(c.caption){const cap=document.createElement('div');cap.className='media-caption';cap.textContent=c.caption;target.appendChild(cap)}
 if(c.credit||c.source){const cr=document.createElement('div');cr.className='media-credit';if(c.source){const a=document.createElement('a');a.href=c.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent=c.credit||'Source de l’image';cr.appendChild(a)}else cr.textContent=c.credit;target.appendChild(cr)}
}
function render(){
 if(!filtered.length){$('empty').style.display='block';card.style.visibility='hidden';$('counter').textContent='0 carte';$('bar').style.width='0';renderList();return}
 $('empty').style.display='none';card.style.visibility='visible';index=Math.max(0,Math.min(index,filtered.length-1));
 const c=filtered[index];$('catFront').textContent=$('catBack').textContent=c.category;$('front').textContent=c.front;$('back').textContent=c.back;const hasMedia=Boolean(c.image||c.imageBack);card.classList.toggle('media-card',hasMedia);card.parentElement.classList.toggle('media-card',hasMedia);$('frontFace').classList.toggle('media-face',hasMedia);$('backFace').classList.toggle('media-face',hasMedia);renderMedia('mediaFront',c,false);renderMedia('mediaBack',c,true);
 $('idxFront').textContent=$('idxBack').textContent=`${index+1} / ${filtered.length}`;$('counter').textContent=`Carte ${index+1} / ${filtered.length}`;
 $('masteredCount').textContent=`${mastered.size} maîtrisée${mastered.size>1?'s':''}`;$('bar').style.width=`${((index+1)/filtered.length)*100}%`;
 flipped=false;card.classList.remove('flipped');$('mastered').textContent=mastered.has(cardId(c))?'Maîtrisée ✓':'Je maîtrise';renderList();
}
function renderList(){$('allCards').innerHTML=filtered.map((c,i)=>`<article class="mini" onclick="jump(${i})"><div class="tag">${c.category}</div><h3>${i+1}. ${c.front}</h3></article>`).join('')}
window.jump=i=>{index=i;render();scrollTo({top:0,behavior:'smooth'})}
function apply(){const q=search.value.trim().toLowerCase(),cat=category.value;filtered=deck.cards.filter(c=>(cat==='all'||c.category===cat)&&(!q||(c.category+' '+c.front+' '+c.back).toLowerCase().includes(q)));index=0;render()}
function flip(){if(!filtered.length)return;flipped=!flipped;card.classList.toggle('flipped',flipped)}
function next(){if(filtered.length){index=(index+1)%filtered.length;render()}}
function prev(){if(filtered.length){index=(index-1+filtered.length)%filtered.length;render()}}
card.onclick=flip;$('flip').onclick=flip;$('next').onclick=next;$('prev').onclick=prev;
$('homeBtn').onclick=goHome;$('filterToggle').onclick=()=>controls.classList.toggle('filters-open');
$('shuffle').onclick=()=>{for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}index=0;render()}
$('reset').onclick=()=>{search.value='';category.value='all';filtered=[...deck.cards];mastered.clear();saveMastered();index=0;render()}
$('mastered').onclick=()=>{if(!filtered.length)return;const id=cardId(filtered[index]);mastered.has(id)?mastered.delete(id):mastered.add(id);saveMastered();render()}
search.oninput=apply;category.onchange=apply;
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||!deck)return;if(e.key===' '){e.preventDefault();flip()}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key==='Escape')goHome()});
(function boot(){const d=location.hash.match(/deck=([^&]+)/),f=location.hash.match(/folder=([^&]+)/);if(d)return openDeck(decodeURIComponent(d[1]));if(f)return openFolder(decodeURIComponent(f[1]));renderHome()})();
</script>
</body>
</html>
